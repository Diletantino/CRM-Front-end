# Docker Desktop/shared files can retain stale memory-mapped pages after a host
# editor truncates and rewrites a bind-mounted file. Read templates normally so
# live edits cannot produce padded NUL bytes in Apache's static responses.
<Directory /var/www/html/client/res/templates>
    EnableMMAP Off
    EnableSendfile Off
</Directory>

<Directory /var/www/html/html>
    EnableMMAP Off
    EnableSendfile Off
</Directory>
